<p>
  Connects a started PolyTrack 0.6.2 race to PolyBot on
  <code>ws://127.0.0.1:8765</code>. It adds deterministic manual stepping and
  uses a loaded ghost lap as the policy reference line.
</p>
<p>
  This mod is non-vanilla. It masks AI finishes from the game UI so automated
  runs cannot be submitted to the leaderboard.
</p>
